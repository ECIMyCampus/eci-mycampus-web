name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Build production image
        run: docker build -t eci-mycampus-web:ci .
      - name: Smoke test production image
        run: |
          docker run -d --name web -p 3000:3000 eci-mycampus-web:ci
          curl --fail --silent --retry 15 --retry-delay 2 --retry-all-errors --output /dev/null http://localhost:3000/
